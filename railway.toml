# Railway native deploy config (no GitHub Actions).
# Production environment should track the GitHub `main` branch via Railway's
# GitHub integration in the dashboard / CLI — not CI workflows.

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
