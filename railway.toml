# Railway native deploy (GitHub main → production). No GitHub Actions.
# Builder RAILPACK; Node version from package.json engines / .node-version.

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
